<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Carousel Management</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
        }
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #1d252c;
            padding: 40px;
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #fcfcfc;
            font-weight: 600;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #405464;
            background-color: #050708;
            color: #fcfcfc;
            font-family: 'Urbanist', sans-serif;
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .media-preview {
            max-width: 200px;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 8px;
        }
        .upload-progress-container {
            display: none;
            margin-top: 15px;
        }
        .upload-progress-container.active {
            display: block;
        }
        .upload-progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #405464;
            border-radius: 4px;
            overflow: hidden;
        }
        .upload-progress-bar {
            height: 100%;
            width: 0%;
            background-color: #ed1f33;
            border-radius: 4px;
            transition: width 0.2s ease;
        }
        .upload-progress-text {
            color: #888;
            font-size: 13px;
            margin-top: 6px;
        }
        .file-size-info {
            color: #888;
            font-size: 13px;
            margin-top: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background-color: #1d252c;
            border-radius: 16px;
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #405464;
        }
        th {
            background-color: #050708;
            color: #fcfcfc;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 14px;
        }
        td {
            color: #f2f2f2;
        }
        tr:hover {
            background-color: rgba(237, 31, 51, 0.1);
        }
        .slide-thumbnail {
            width: 120px;
            height: 68px;
            object-fit: cover;
            border-radius: 8px;
        }
        .slide-thumbnail-video {
            width: 120px;
            height: 68px;
            border-radius: 8px;
            background-color: #050708;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fcfcfc;
            font-size: 24px;
        }
        .type-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .type-image {
            background-color: #1976d2;
            color: #fcfcfc;
        }
        .type-video {
            background-color: #9c27b0;
            color: #fcfcfc;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
        }
        .status-active {
            background-color: #4caf50;
            color: #fcfcfc;
        }
        .status-inactive {
            background-color: #757575;
            color: #fcfcfc;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: 'Urbanist', sans-serif;
        }
        .btn-primary {
            background-color: #ed1f33;
            color: #fcfcfc;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-secondary {
            background-color: #405464;
            color: #fcfcfc;
        }
        .btn-secondary:hover {
            background-color: #506474;
        }
        .btn-danger {
            background-color: #d32f2f;
            color: #fcfcfc;
        }
        .btn-danger:hover {
            background-color: #b71c1c;
        }
        .btn-edit {
            background-color: #1976d2;
            color: #fcfcfc;
        }
        .btn-edit:hover {
            background-color: #1565c0;
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 14px;
        }
        .btn-icon {
            padding: 6px 10px;
            font-size: 16px;
            min-width: 36px;
            text-align: center;
        }
        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .alert-success {
            background-color: #4caf50;
            color: white;
        }
        .alert-error {
            background-color: #f44336;
            color: white;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #fcfcfc;
        }
        .loading.active {
            display: block;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .nav-link {
            color: #f2f2f2;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        .nav-link:hover {
            color: #ed1f33;
        }
        .nav-link.active {
            color: #ed1f33;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
            cursor: pointer;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #757575;
            border-radius: 26px;
            transition: 0.3s;
        }
        .toggle-slider:before {
            content: "";
            position: absolute;
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: #fcfcfc;
            border-radius: 50%;
            transition: 0.3s;
        }
        .toggle-switch input:checked + .toggle-slider {
            background-color: #4caf50;
        }
        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(22px);
        }
    </style>
</head>
<body>
    <div class="bg-[#050708] min-h-screen">
        <div class="admin-container">
            <div id="alertContainer"></div>
            <div id="authContainer" style="display: none;">
                <div class="text-center text-white">
                    <h2 class="text-2xl font-bold mb-4">Please Sign In</h2>
                    <p>You need to be authenticated to access the admin panel.</p>
                </div>
            </div>

            <div id="mainContent" style="display: none;">
                <!-- Admin Navigation Bar -->
                <div style="background-color: #1d252c; padding: 20px; border-radius: 12px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center;">
                    <div class="nav-links">
                        <a href="admin.html" class="nav-link">Players</a>
                        <a href="teams-admin.html" class="nav-link">Teams</a>
                        <a href="events-admin.html" class="nav-link">Events</a>
                        <a href="carousel-admin.html" class="nav-link active">Carousel</a>
                        <a href="admins-admin.html" class="nav-link" id="adminsNavLink" style="display: none;">Admins</a>
                    </div>
                    <div style="display: flex; gap: 20px; align-items: center;">
                        <span id="userEmail" style="color: #f2f2f2; font-size: 14px;"></span>
                        <button id="logoutBtn" class="btn btn-secondary btn-small">Logout</button>
                    </div>
                </div>

                <div class="flex justify-between items-center mb-8">
                    <h1 class="font-pressio text-[#fcfcfc] text-[64px] uppercase">Carousel</h1>
                    <button id="addSlideBtn" class="btn btn-primary">Add New Slide</button>
                </div>

                <div class="loading" id="loadingIndicator">Loading slides...</div>

                <table id="slidesTable">
                    <thead>
                        <tr>
                            <th>Preview</th>
                            <th>Type</th>
                            <th>Alt Text</th>
                            <th>Order</th>
                            <th>Active</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="slidesTableBody">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Add/Edit Slide Modal -->
        <div id="slideModal" class="modal">
            <div class="modal-content">
                <h2 id="modalTitle" class="font-pressio text-[#fcfcfc] text-[32px] mb-6">Add Slide</h2>
                <form id="slideForm">
                    <input type="hidden" id="slideId">
                    <input type="hidden" id="existingMediaUrl">

                    <div class="form-group">
                        <label for="slideMedia">Media File *</label>
                        <input type="file" id="slideMedia" accept="image/jpeg,image/jpg,image/png,image/webp,image/avif,video/mp4,video/webm,video/mov,video/quicktime">
                        <small style="color: #888; margin-top: 5px; display: block;">Images: max 5MB (JPEG, PNG, WebP, AVIF). Videos: max 20MB (MP4, WebM, MOV).</small>
                        <div id="fileSizeInfo" class="file-size-info"></div>
                        <img id="mediaPreview" class="media-preview" style="display: none;">
                        <video id="videoPreview" class="media-preview" style="display: none;" muted></video>
                        <div id="uploadProgress" class="upload-progress-container">
                            <div class="upload-progress-bar-bg">
                                <div id="uploadProgressBar" class="upload-progress-bar"></div>
                            </div>
                            <div id="uploadProgressText" class="upload-progress-text">Uploading... 0%</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="slideAltText">Alt Text</label>
                        <input type="text" id="slideAltText" placeholder="Describe the slide content...">
                    </div>

                    <div class="form-group">
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" id="slideActive" checked style="width: 20px; height: 20px; cursor: pointer;">
                            <span>Active (visible on homepage)</span>
                        </label>
                    </div>

                    <div class="flex gap-4 mt-6">
                        <button type="submit" class="btn btn-primary flex-1">Save Slide</button>
                        <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ueyhnpazdbtwstkcyedu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVleWhucGF6ZGJ0d3N0a2N5ZWR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI0NjM3NzYsImV4cCI6MjA3ODAzOTc3Nn0.leC8cE_Tlj9UvOkov1IhfPdJ0ppeWJtAX2zS1tyZyPg';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allSlides = [];

        // DOM Elements
        const slideModal = document.getElementById('slideModal');
        const slideForm = document.getElementById('slideForm');
        const addSlideBtn = document.getElementById('addSlideBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const slidesTableBody = document.getElementById('slidesTableBody');
        const mediaInput = document.getElementById('slideMedia');
        const mediaPreview = document.getElementById('mediaPreview');
        const videoPreview = document.getElementById('videoPreview');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const alertContainer = document.getElementById('alertContainer');
        const mainContent = document.getElementById('mainContent');

        // Initialize
        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) {
                window.location.href = 'admin-login.html';
                return;
            }

            try {
                const { data: adminUser, error } = await supabaseClient
                    .from('admin_users')
                    .select('*')
                    .eq('email', session.user.email)
                    .single();

                if (error || !adminUser) {
                    await supabaseClient.auth.signOut();
                    window.location.href = 'admin-login.html';
                    return;
                }

                if (adminUser.role === 'super_admin') {
                    const adminsNavLink = document.getElementById('adminsNavLink');
                    if (adminsNavLink) adminsNavLink.style.display = 'inline-block';
                }

                mainContent.style.display = 'block';

                const userEmailEl = document.getElementById('userEmail');
                if (userEmailEl && session.user) {
                    userEmailEl.textContent = session.user.email;
                }

                loadSlides();
            } catch (error) {
                console.error('Error checking admin status:', error);
                await supabaseClient.auth.signOut();
                window.location.href = 'admin-login.html';
            }
        }

        // Logout
        document.addEventListener('DOMContentLoaded', () => {
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async () => {
                    try {
                        await supabaseClient.auth.signOut();
                        window.location.href = 'admin-login.html';
                    } catch (error) {
                        showAlert('Failed to logout: ' + error.message, 'error');
                    }
                });
            }
        });

        function showAlert(message, type = 'success') {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alertContainer.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        // Load slides
        async function loadSlides() {
            loadingIndicator.classList.add('active');
            try {
                const { data: slides, error } = await supabaseClient
                    .from('carousel_slides')
                    .select('*')
                    .order('sort_order', { ascending: true });

                if (error) throw error;

                allSlides = slides || [];
                displaySlides(allSlides);
            } catch (error) {
                console.error('Error loading slides:', error);
                showAlert('Failed to load slides: ' + error.message, 'error');
            } finally {
                loadingIndicator.classList.remove('active');
            }
        }

        // Display slides
        function displaySlides(slides) {
            slidesTableBody.innerHTML = '';

            if (slides.length === 0) {
                slidesTableBody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No slides found. Add your first slide!</td></tr>';
                return;
            }

            slides.forEach((slide, index) => {
                const row = document.createElement('tr');

                // Preview
                const previewCell = document.createElement('td');
                if (slide.media_type === 'video') {
                    const div = document.createElement('div');
                    div.className = 'slide-thumbnail-video';
                    div.innerHTML = '&#9654;';
                    previewCell.appendChild(div);
                } else {
                    const img = document.createElement('img');
                    img.className = 'slide-thumbnail';
                    img.src = slide.media_url;
                    img.alt = slide.alt_text || '';
                    previewCell.appendChild(img);
                }

                // Type badge
                const typeCell = document.createElement('td');
                const typeBadge = document.createElement('span');
                typeBadge.className = `type-badge type-${slide.media_type}`;
                typeBadge.textContent = slide.media_type;
                typeCell.appendChild(typeBadge);

                // Alt text
                const altCell = document.createElement('td');
                altCell.textContent = slide.alt_text || '-';

                // Order
                const orderCell = document.createElement('td');
                const orderDiv = document.createElement('div');
                orderDiv.className = 'actions';

                const upBtn = document.createElement('button');
                upBtn.className = 'btn btn-secondary btn-icon';
                upBtn.innerHTML = '&#9650;';
                upBtn.title = 'Move up';
                upBtn.disabled = index === 0;
                upBtn.addEventListener('click', () => moveSlide(slide.id, 'up'));

                const downBtn = document.createElement('button');
                downBtn.className = 'btn btn-secondary btn-icon';
                downBtn.innerHTML = '&#9660;';
                downBtn.title = 'Move down';
                downBtn.disabled = index === slides.length - 1;
                downBtn.addEventListener('click', () => moveSlide(slide.id, 'down'));

                const orderLabel = document.createElement('span');
                orderLabel.textContent = slide.sort_order;
                orderLabel.style.margin = '0 8px';

                orderDiv.appendChild(upBtn);
                orderDiv.appendChild(orderLabel);
                orderDiv.appendChild(downBtn);
                orderCell.appendChild(orderDiv);

                // Active toggle
                const activeCell = document.createElement('td');
                const toggleLabel = document.createElement('label');
                toggleLabel.className = 'toggle-switch';
                const toggleInput = document.createElement('input');
                toggleInput.type = 'checkbox';
                toggleInput.checked = slide.is_active;
                toggleInput.addEventListener('change', () => toggleActive(slide.id, toggleInput.checked));
                const toggleSlider = document.createElement('span');
                toggleSlider.className = 'toggle-slider';
                toggleLabel.appendChild(toggleInput);
                toggleLabel.appendChild(toggleSlider);
                activeCell.appendChild(toggleLabel);

                // Actions
                const actionsCell = document.createElement('td');
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'actions';

                const editBtn = document.createElement('button');
                editBtn.className = 'btn btn-edit btn-small';
                editBtn.textContent = 'Edit';
                editBtn.addEventListener('click', () => editSlide(slide.id));

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn btn-danger btn-small';
                deleteBtn.textContent = 'Delete';
                deleteBtn.addEventListener('click', () => deleteSlide(slide.id, slide.media_url));

                actionsDiv.appendChild(editBtn);
                actionsDiv.appendChild(deleteBtn);
                actionsCell.appendChild(actionsDiv);

                row.appendChild(previewCell);
                row.appendChild(typeCell);
                row.appendChild(altCell);
                row.appendChild(orderCell);
                row.appendChild(activeCell);
                row.appendChild(actionsCell);

                slidesTableBody.appendChild(row);
            });
        }

        // Detect media type from file extension
        function getMediaType(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const videoExts = ['mp4', 'webm', 'mov', 'quicktime'];
            return videoExts.includes(ext) ? 'video' : 'image';
        }

        // Open modal for adding
        addSlideBtn.addEventListener('click', () => {
            document.getElementById('modalTitle').textContent = 'Add Slide';
            slideForm.reset();
            document.getElementById('slideId').value = '';
            document.getElementById('existingMediaUrl').value = '';
            document.getElementById('slideActive').checked = true;
            mediaPreview.style.display = 'none';
            videoPreview.style.display = 'none';
            slideModal.classList.add('active');
        });

        // Close modal
        cancelBtn.addEventListener('click', () => slideModal.classList.remove('active'));
        slideModal.addEventListener('click', (e) => {
            if (e.target === slideModal) slideModal.classList.remove('active');
        });

        // Media preview
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        mediaInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            const fileSizeInfo = document.getElementById('fileSizeInfo');
            if (!file) {
                fileSizeInfo.textContent = '';
                return;
            }

            const mediaType = getMediaType(file.name);
            const maxSize = mediaType === 'video' ? 20 * 1024 * 1024 : 5 * 1024 * 1024;

            fileSizeInfo.textContent = `File size: ${formatFileSize(file.size)}`;

            if (file.size > maxSize) {
                const limitMB = mediaType === 'video' ? '20MB' : '5MB';
                showAlert(`File size must be less than ${limitMB}. Your file is ${formatFileSize(file.size)}.`, 'error');
                mediaInput.value = '';
                fileSizeInfo.textContent = '';
                mediaPreview.style.display = 'none';
                videoPreview.style.display = 'none';
                return;
            }

            if (mediaType === 'video') {
                mediaPreview.style.display = 'none';
                videoPreview.src = URL.createObjectURL(file);
                videoPreview.style.display = 'block';
            } else {
                videoPreview.style.display = 'none';
                const reader = new FileReader();
                reader.onload = (e) => {
                    mediaPreview.src = e.target.result;
                    mediaPreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Upload media with progress
        function uploadMedia(file) {
            const fileExt = file.name.split('.').pop();
            const fileName = `${Math.random().toString(36).substring(2)}-${Date.now()}.${fileExt}`;

            const progressContainer = document.getElementById('uploadProgress');
            const progressBar = document.getElementById('uploadProgressBar');
            const progressText = document.getElementById('uploadProgressText');

            progressContainer.classList.add('active');
            progressBar.style.width = '0%';
            progressText.textContent = 'Uploading... 0%';

            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                const url = `${SUPABASE_URL}/storage/v1/object/carousel-media/${fileName}`;

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const pct = Math.round((e.loaded / e.total) * 100);
                        progressBar.style.width = pct + '%';
                        progressText.textContent = `Uploading... ${pct}% (${formatFileSize(e.loaded)} / ${formatFileSize(e.total)})`;
                    }
                });

                xhr.addEventListener('load', () => {
                    progressContainer.classList.remove('active');
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const { data: { publicUrl } } = supabaseClient.storage
                            .from('carousel-media')
                            .getPublicUrl(fileName);
                        resolve(publicUrl);
                    } else {
                        let msg = 'Upload failed';
                        try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e) {}
                        reject(new Error(msg));
                    }
                });

                xhr.addEventListener('error', () => {
                    progressContainer.classList.remove('active');
                    reject(new Error('Upload failed — network error'));
                });

                // Get the current session token, then send
                supabaseClient.auth.getSession().then(({ data: { session } }) => {
                    xhr.open('POST', url);
                    if (session) {
                        xhr.setRequestHeader('Authorization', `Bearer ${session.access_token}`);
                    }
                    xhr.setRequestHeader('x-upsert', 'false');
                    xhr.send(file);
                }).catch(reject);
            });
        }

        // Delete media from storage
        async function deleteMedia(mediaUrl) {
            if (!mediaUrl) return;
            try {
                const urlParts = mediaUrl.split('/');
                const fileName = urlParts[urlParts.length - 1];
                await supabaseClient.storage
                    .from('carousel-media')
                    .remove([fileName]);
            } catch (error) {
                console.error('Error deleting media:', error);
            }
        }

        // Submit form
        slideForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const slideId = document.getElementById('slideId').value;
            const altText = document.getElementById('slideAltText').value;
            const isActive = document.getElementById('slideActive').checked;
            const mediaFile = mediaInput.files[0];
            let mediaUrl = document.getElementById('existingMediaUrl').value;
            let mediaType = null;

            // Require file for new slides
            if (!slideId && !mediaFile) {
                showAlert('Please select a media file.', 'error');
                return;
            }

            const submitBtn = slideForm.querySelector('button[type="submit"]');
            try {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Saving...';

                if (mediaFile) {
                    // Delete old media if editing
                    if (slideId && mediaUrl) {
                        await deleteMedia(mediaUrl);
                    }
                    mediaUrl = await uploadMedia(mediaFile);
                    mediaType = getMediaType(mediaFile.name);
                }

                if (slideId) {
                    // Update existing
                    const updateData = {
                        alt_text: altText || '',
                        is_active: isActive,
                        updated_at: new Date().toISOString()
                    };
                    if (mediaFile) {
                        updateData.media_url = mediaUrl;
                        updateData.media_type = mediaType;
                    }

                    const { error } = await supabaseClient
                        .from('carousel_slides')
                        .update(updateData)
                        .eq('id', slideId);

                    if (error) throw error;
                    showAlert('Slide updated successfully!');
                } else {
                    // Get next sort_order
                    const maxOrder = allSlides.length > 0
                        ? Math.max(...allSlides.map(s => s.sort_order))
                        : -1;

                    const { error } = await supabaseClient
                        .from('carousel_slides')
                        .insert([{
                            media_url: mediaUrl,
                            media_type: mediaType,
                            alt_text: altText || '',
                            sort_order: maxOrder + 1,
                            is_active: isActive
                        }]);

                    if (error) throw error;
                    showAlert('Slide added successfully!');
                }

                slideModal.classList.remove('active');
                loadSlides();
            } catch (error) {
                console.error('Error saving slide:', error);
                showAlert('Failed to save slide: ' + error.message, 'error');
                document.getElementById('uploadProgress').classList.remove('active');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Save Slide';
            }
        });

        // Edit slide
        async function editSlide(id) {
            try {
                const { data: slide, error } = await supabaseClient
                    .from('carousel_slides')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (error) throw error;

                document.getElementById('modalTitle').textContent = 'Edit Slide';
                document.getElementById('slideId').value = slide.id;
                document.getElementById('slideAltText').value = slide.alt_text || '';
                document.getElementById('slideActive').checked = slide.is_active;
                document.getElementById('existingMediaUrl').value = slide.media_url || '';

                mediaInput.value = '';
                videoPreview.style.display = 'none';

                if (slide.media_type === 'video') {
                    mediaPreview.style.display = 'none';
                    videoPreview.src = slide.media_url;
                    videoPreview.style.display = 'block';
                } else if (slide.media_url) {
                    mediaPreview.src = slide.media_url;
                    mediaPreview.style.display = 'block';
                    videoPreview.style.display = 'none';
                } else {
                    mediaPreview.style.display = 'none';
                }

                slideModal.classList.add('active');
            } catch (error) {
                console.error('Error loading slide:', error);
                showAlert('Failed to load slide: ' + error.message, 'error');
            }
        }

        // Delete slide
        async function deleteSlide(id, mediaUrl) {
            if (!confirm('Are you sure you want to delete this slide?')) return;

            try {
                const { error } = await supabaseClient
                    .from('carousel_slides')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                if (mediaUrl) await deleteMedia(mediaUrl);

                showAlert('Slide deleted successfully!');
                loadSlides();
            } catch (error) {
                console.error('Error deleting slide:', error);
                showAlert('Failed to delete slide: ' + error.message, 'error');
            }
        }

        // Toggle active/inactive
        async function toggleActive(id, isActive) {
            try {
                const { error } = await supabaseClient
                    .from('carousel_slides')
                    .update({ is_active: isActive, updated_at: new Date().toISOString() })
                    .eq('id', id);

                if (error) throw error;

                showAlert(`Slide ${isActive ? 'activated' : 'deactivated'}.`);
                // Update local data
                const slide = allSlides.find(s => s.id === id);
                if (slide) slide.is_active = isActive;
            } catch (error) {
                console.error('Error toggling slide:', error);
                showAlert('Failed to update slide: ' + error.message, 'error');
                loadSlides(); // Reload to reset toggle state
            }
        }

        // Move slide up or down
        async function moveSlide(id, direction) {
            const currentIndex = allSlides.findIndex(s => s.id === id);
            if (currentIndex === -1) return;

            const swapIndex = direction === 'up' ? currentIndex - 1 : currentIndex + 1;
            if (swapIndex < 0 || swapIndex >= allSlides.length) return;

            const currentSlide = allSlides[currentIndex];
            const swapSlide = allSlides[swapIndex];

            try {
                // Swap sort_order values
                const { error: err1 } = await supabaseClient
                    .from('carousel_slides')
                    .update({ sort_order: swapSlide.sort_order, updated_at: new Date().toISOString() })
                    .eq('id', currentSlide.id);

                if (err1) throw err1;

                const { error: err2 } = await supabaseClient
                    .from('carousel_slides')
                    .update({ sort_order: currentSlide.sort_order, updated_at: new Date().toISOString() })
                    .eq('id', swapSlide.id);

                if (err2) throw err2;

                loadSlides();
            } catch (error) {
                console.error('Error reordering slides:', error);
                showAlert('Failed to reorder slides: ' + error.message, 'error');
            }
        }

        init();
    </script>
    <script src="script.js"></script>
</body>
</html>
